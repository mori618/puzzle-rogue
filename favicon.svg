<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gradient for Grass Drop Base -->
    <linearGradient id="grassDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <!-- Inner Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <!-- Leaf Icon Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
  </defs>

  <!-- Base Drop Shape (Grass Drop / Rune Drop) -->
  <g filter="url(#glow)">
    <!-- Main Drop Body -->
    <path d="M 256 40 C 256 40 96 230 96 336 C 96 424 167.6 480 256 480 C 344.4 480 416 424 416 336 C 416 230 256 40 256 40 Z" fill="url(#grassDropGrad)" stroke="#6EE7B7" stroke-width="10"/>
    
    <!-- Top Glassy Gloss Highlight -->
    <path d="M 256 65 C 256 65 130 220 130 320 C 130 340 145 345 160 325 C 200 270 240 150 256 65 Z" fill="url(#highlightGrad)"/>
    
    <!-- Leaf Emblem in Center -->
    <g transform="translate(256, 320) scale(1.15)">
      <!-- Main Leaf Contour -->
      <path d="M 0 -85 C 48 -45 58 35 0 75 C -58 35 -48 -45 0 -85 Z" fill="url(#leafGrad)"/>
      <!-- Leaf Vein Pattern -->
      <path d="M 0 -70 Q -5 0 0 65" stroke="#047857" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M 0 -20 Q 18 -35 28 -40" stroke="#047857" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M 0 10 Q -18 -5 -28 -10" stroke="#047857" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M 0 35 Q 18 20 26 15" stroke="#047857" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Sparkle / Star Accent -->
    <path d="M 345 155 L 352 173 L 370 180 L 352 187 L 345 205 L 338 187 L 320 180 L 338 173 Z" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
