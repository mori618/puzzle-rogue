<!doctype html>
<html lang="ja" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="パズル×ローグライクの爽快感！ドロップを揃えてコンボを繋ぎ、強力なトークンやエンチャントを獲得して最高到達目標スコアを目指す本格ローグライクパズルゲーム。" />
  <meta property="og:title" content="Pazuru Roguelike" />
  <meta property="og:description" content="パズル×ローグライクの爽快感！ドロップを揃えてコンボを繋ぎ、強力なトークンやエンチャントを獲得して最高到達目標スコアを目指す本格ローグライクパズルゲーム。" />
  <meta property="og:type" content="website" />
  <title>Pazuru Roguelike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after {
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    /* パズル盤面およびドロップ操作時のタッチ挙動・操作感最適化 */
    .puzzle-board, #board, [class*="board"] {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .orb, [class*="orb"] {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      cursor: grab;
      will-change: transform, left, top;
    }

    /* 非ドラッグ状態のドロップ：スワップ（入れ替え）時に滑らかに移動 */
    .orb:not(.dragging):not(.is-dragging):not([data-dragging="true"]) {
      transition: left 0.08s cubic-bezier(0.22, 1, 0.36, 1), top 0.08s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ドラッグ操作中のドロップ：指やマウスへ即時追従し、浮遊感と視認性を強調 */
    .orb:active,
    .orb.dragging,
    .orb.is-dragging,
    .orb[data-dragging="true"],
    [class*="orb"]:active {
      cursor: grabbing;
      z-index: 1000 !important;
      transform: scale(1.16);
      filter: brightness(1.15) drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.45));
      transition: transform 0.08s ease-out, filter 0.08s ease-out !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
